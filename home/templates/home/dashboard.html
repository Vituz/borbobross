{% extends "home/dash_index.html" %}
{% load static %}


{% block title %} {{ request.user.username }} {% endblock title %}


{% block main-content %}
    <main class="container mx-auto px-4 py-10">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">I Miei Mazzi</h1>
            <button
                class="bg-primary hover:bg-opacity-80 text-white px-6 py-3 !rounded-button whitespace-nowrap transition-colors duration-300 flex items-center">
                <i class="ri-add-line mr-2"></i>
                Crea Nuovo Mazzo
            </button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Mazzo 1 -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden card-hover">
                <div class="h-48 bg-cover bg-center"
                    style="background-image: url('https://readdy.ai/api/search-image?query=Magic%20The%20Gathering%20deck%20with%20dragons%20theme%2C%20mystical%20dragon%20artwork%2C%20epic%20fantasy%20scene%20with%20multiple%20dragons%2C%20professional%20card%20game%20photography&width=400&height=300&seq=8&orientation=landscape')">
                </div>
                <div class="p-4">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="text-xl font-semibold text-gray-800">Draghi Infuocati</h3>
                        <div class="flex space-x-1">
                            <img src="https://readdy.ai/api/search-image?query=red%20mana%20symbol%20from%20Magic%20The%20Gathering%2C%20simple%20icon%2C%20clean%20background&width=20&height=20&seq=9&orientation=squarish"
                                alt="Red Mana" class="w-5 h-5">
                            <img src="https://readdy.ai/api/search-image?query=black%20mana%20symbol%20from%20Magic%20The%20Gathering%2C%20simple%20icon%2C%20clean%20background&width=20&height=20&seq=10&orientation=squarish"
                                alt="Black Mana" class="w-5 h-5">
                        </div>
                    </div>
                    <p class="text-gray-600 text-sm mb-4">60 carte - Aggiornato 2 giorni fa</p>
                    <div class="flex justify-between items-center">
                        <button class="text-primary hover:text-opacity-80 flex items-center">
                            <i class="ri-edit-line mr-1"></i>
                            Modifica
                        </button>
                        <button class="text-gray-600 hover:text-gray-800">
                            <i class="ri-more-2-fill"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
{% endblock main-content %}
